name: Build POCO X6 Pro DuchampCine APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7 (Wrapper-Free Bootstrap)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release Signed APK for POCO X6 Pro (duchamp)
        run: gradle assembleDebug

      - name: Rename APK for Easy Install
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DuchampCine-PocoX6Pro.apk

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuchampCine-PocoX6Pro-APK
          path: app/build/outputs/apk/debug/DuchampCine-PocoX6Pro.apk

      - name: Publish Automatic GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Duchamp Cine v1.0.${{ github.run_number }} (POCO X6 Pro 5G)"
          body: "Otomatik derlenen POCO X6 Pro (duchamp) Zero-ISP 8-Yönetmen Sinema Kamerası APK paketi."
          files: app/build/outputs/apk/debug/DuchampCine-PocoX6Pro.apk
