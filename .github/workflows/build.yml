name: Build Duchamp Cine APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unpack zip
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi

      - name: Ensure Root Gradle Scaffolding
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo 'include(":app")' > settings.gradle.kts
            echo 'rootProject.name = "DuchampCine"' >> settings.gradle.kts
          fi
          if [ ! -f build.gradle.kts ] && [ ! -f build.gradle ]; then
            cat << 'EOF' > build.gradle.kts
            plugins {
                id("com.android.application") version "8.5.1" apply false
                id("org.jetbrains.kotlin.android") version "1.9.24" apply false
            }
            EOF
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuchampCine-POCO-X6-Pro
          path: app/build/outputs/apk/debug/*.apk